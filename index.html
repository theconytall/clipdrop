
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090f">
<title>ClipDrop — Video Downloader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#09090f;--panel:#11111b;--panel2:#171725;
  --border:#29293b;--purple:#8b5cf6;--purple2:#a78bfa;
  --text:#f5f3ff;--muted:#9693aa;--green:#4ade80;--red:#fb7185;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
header{height:76px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 7%;background:#09090fe8}
.logo{font:700 25px 'Space Grotesk';letter-spacing:-1px}
.logo span{color:var(--purple2)}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#777}
.dot.online{background:var(--green);box-shadow:0 0 10px #4ade8070}
.dot.offline{background:var(--red)}
main{max-width:850px;margin:0 auto;padding:75px 22px}
.hero{text-align:center;margin-bottom:42px}
.eyebrow{color:var(--purple2);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
h1{font:700 clamp(38px,7vw,62px) 'Space Grotesk';letter-spacing:-2.5px;margin:15px 0}
h1 span{color:var(--purple2)}
.subtitle{color:var(--muted);font-size:15px;line-height:1.7}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:27px;box-shadow:0 25px 80px #0005}
.section-title{font:600 17px 'Space Grotesk';margin:0 0 18px}
.platforms{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:25px}
.platform{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:16px 8px;font-weight:700;transition:.2s}
.platform:hover,.platform.active{border-color:var(--purple);background:#8b5cf61a;color:var(--purple2)}
.platform small{display:block;color:var(--muted);font-size:11px;margin-top:5px;font-weight:500}
.field{width:100%;background:#09090f;border:1px solid var(--border);border-radius:12px;padding:16px;color:white;outline:none}
.field:focus{border-color:var(--purple)}
.primary{width:100%;border:0;border-radius:12px;padding:16px;background:linear-gradient(100deg,#7c3aed,#9b70f5);color:white;font-weight:800;margin-top:14px;transition:.2s}
.primary:hover{filter:brightness(1.12);transform:translateY(-1px)}
.primary:disabled{opacity:.45;cursor:not-allowed;transform:none}
.message{font-size:13px;color:var(--muted);margin-top:12px;min-height:20px}
.page{display:none}.page.active{display:block}
.back{background:none;border:0;color:var(--muted);padding:0 0 20px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.option{background:var(--panel2);border:1px solid var(--border);border-radius:13px;padding:19px;color:var(--text);text-align:left}
.option.active{border-color:var(--purple);background:#8b5cf61a}
.option strong{display:block;margin-bottom:5px}
.option small{color:var(--muted)}
.quality{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
.quality button{background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:10px 15px;border-radius:9px}
.quality button.active{color:var(--purple2);border-color:var(--purple)}
.note{border:1px solid var(--border);background:#171725;border-radius:12px;padding:15px;margin-top:20px;font-size:13px;color:var(--muted);line-height:1.6}
footer{text-align:center;color:#77748a;font-size:12px;padding:30px}
@media(max-width:550px){header{padding:0 20px}.platforms{grid-template-columns:repeat(2,1fr)}main{padding-top:48px}.panel{padding:19px}.options{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">Clip<span>Drop.</span></div>
  <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Checking backend...</span></div>
</header>

<main>
  <div class="hero">
    <div class="eyebrow">Simple. Fast. Convenient.</div>
    <h1>Videos made <span>simple.</span></h1>
    <p class="subtitle">Your media workspace. Paste a supported media URL to get started.</p>
  </div>

  <section class="panel page active" id="inputPage">
    <h2 class="section-title">Choose a platform</h2>
    <div class="platforms">
      <button class="platform active" data-platform="TikTok">TikTok<small>Short videos</small></button>
      <button class="platform" data-platform="Instagram">Instagram<small>Reels & media</small></button>
      <button class="platform" data-platform="Facebook">Facebook<small>Public media</small></button>
      <button class="platform" data-platform="YouTube">YouTube<small>Videos</small></button>
      <button class="platform" data-platform="X">X / Twitter<small>Posts</small></button>
      <button class="platform" data-platform="Pinterest">Pinterest<small>Pins</small></button>
    </div>
    <h2 class="section-title">Paste your link</h2>
    <input class="field" id="videoUrl" type="url" placeholder="https://example.com/video..." autocomplete="url">
    <button class="primary" id="continueBtn">Continue →</button>
    <div class="message" id="inputMessage"></div>
  </section>

  <section class="panel page" id="formatPage">
    <button class="back" id="backBtn">← Back</button>
    <h2 class="section-title">Choose your format</h2>
    <div class="options">
      <button class="option active" data-format="MP4"><strong>MP4 Video</strong><small>Video with sound</small></button>
      <button class="option" data-format="MP3"><strong>MP3 Audio</strong><small>Audio only</small></button>
    </div>
    <h2 class="section-title" style="margin-top:25px">Video quality</h2>
    <div class="quality">
      <button data-quality="360p">360p</button>
      <button data-quality="480p">480p</button>
      <button class="active" data-quality="720p">720p</button>
      <button data-quality="1080p">1080p</button>
      <button data-quality="Original">Original</button>
    </div>
    <div class="note" id="processingNote">Checking backend connection...</div>
    <button class="primary" id="downloadBtn" disabled>Media processing not configured yet</button>
    <div class="message" id="downloadMessage"></div>
  </section>
</main>

<footer>ClipDrop · Built for a simpler media experience</footer>

<script>
const BACKEND = "https://clipdrop-backend.onrender.com";
const $ = id => document.getElementById(id);

let selectedPlatform = "TikTok";
let selectedFormat = "MP4";
let selectedQuality = "720p";
let backendOnline = false;

async function checkBackend() {
  const dot = $("statusDot");
  const label = $("statusText");
  const note = $("processingNote");

  label.textContent = "Connecting...";
  dot.className = "dot";

  try {
    const response = await fetch(`${BACKEND}/health`, {
      method: "GET",
      signal: AbortSignal.timeout(15000)
    });

    if (!response.ok) throw new Error("Backend returned an error");

    const data = await response.json();
    if (data.status !== "running" && data.status !== "ok") {
      throw new Error("Unexpected backend response");
    }

    backendOnline = true;
    dot.className = "dot online";
    label.textContent = "Backend connected";
    if (note) note.textContent = "✓ Backend connected successfully. Media processing still needs to be configured.";
  } catch (error) {
    backendOnline = false;
    dot.className = "dot offline";
    label.textContent = "Backend unavailable";
    if (note) note.textContent = "Backend is unavailable right now. Render may be waking up. Try again in a moment.";
  }
}

document.querySelectorAll(".platform").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".platform").forEach(b => b.classList.remove("active"));
    button.classList.add("active");
    selectedPlatform = button.dataset.platform;
  });
});

$("continueBtn").addEventListener("click", () => {
  const raw = $("videoUrl").value.trim();
  const message = $("inputMessage");

  if (!raw) {
    message.textContent = "Please paste a link first.";
    return;
  }

  let url;
  try {
    url = new URL(raw);
    if (!["http:", "https:"].includes(url.protocol)) throw new Error();
  } catch {
    message.textContent = "Please enter a valid URL beginning with https://";
    return;
  }

  const domains = {
    TikTok: ["tiktok.com"],
    Instagram: ["instagram.com"],
    Facebook: ["facebook.com", "fb.watch"],
    YouTube: ["youtube.com", "youtu.be"],
    X: ["x.com", "twitter.com"],
    Pinterest: ["pinterest.com", "pin.it"]
  };

  const hostname = url.hostname.toLowerCase().replace(/^www\./, "");
  const valid = domains[selectedPlatform].some(domain =>
    hostname === domain || hostname.endsWith("." + domain)
  );

  if (!valid) {
    message.textContent = `That doesn't look like a ${selectedPlatform} link.`;
    return;
  }

  message.textContent = "";
  $("inputPage").classList.remove("active");
  $("formatPage").classList.add("active");
  checkBackend();
});

$("backBtn").addEventListener("click", () => {
  $("formatPage").classList.remove("active");
  $("inputPage").classList.add("active");
});

document.querySelectorAll("[data-format]").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll("[data-format]").forEach(b => b.classList.remove("active"));
    button.classList.add("active");
    selectedFormat = button.dataset.format;
  });
});

document.querySelectorAll("[data-quality]").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll("[data-quality]").forEach(b => b.classList.remove("active"));
    button.classList.add("active");
    selectedQuality = button.dataset.quality;
  });
});

$("downloadBtn").addEventListener("click", () => {
  $("downloadMessage").textContent =
    "Media processing is not implemented yet. The backend connection alone cannot download videos.";
});

checkBackend();
</script>
</body>
</html>
